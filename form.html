<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <P>Your Name:</P>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="Afrin"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="afrin@example.com"><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" value="password123"><br><br>
        
       <p>Your favorite hobby:</p>
       <input type="checkbox" id="hobby1" name="hobby" value="Reading">
       <label for="hobby1">Reading</label><br>
       <input type="checkbox" id="hobby2" name="hobby" value="Traveling">
       <label for="hobby2">Traveling</label><br>
       <input type="checkbox" id="hobby3" name="hobby" value="Cooking">
       <label for="hobby3">Cooking</label><br>
       <input type="checkbox" id="hobby4" name="hobby" value="Sports">
       <label for="hobby4">Sports</label><br>
       <input type="checkbox" id="hobby5" name="hobby" value="Music">
       <label for="hobby5">Music</label><br>
       <p>Select your favorite city from the dropdown:</p>
       <select name="city" id="citySelect">
        <option value="New York">New York</option>
        <option value="Los Angeles">Los Angeles</option>
        <option value="Chicago">Chicago</option>
        <option selected value="Houston">Houston</option>
        <option value="Music">Music</option>
        </select>
<p>Give your feedback:</p><br>
        <textarea name="feedback" rows="4" cols="50" style="border: 2px solid black;"></textarea><br><br>
        <input type="submit" value="Submit"><br>


    </form>
</body>
</html>
